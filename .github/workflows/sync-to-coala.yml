# 개인 레포의 .github/workflows/sync-to-coala.yml 로 저장
name: Sync to coala-study/coding-test
on:
  push:
    branches: [main]   # 개인 레포 기본 브랜치명에 맞춰 수정 (main / master 등)
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 내 풀이 레포 체크아웃
        uses: actions/checkout@v4
        with:
          path: source
      - name: coala-study/coding-test 체크아웃
        uses: actions/checkout@v4
        with:
          repository: coala-study/coding-test
          token: ${{ secrets.COALA_SYNC_TOKEN }}
          path: target
      - name: seungseok 폴더로 복사
        run: |
          mkdir -p target/seungseok
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='neetcode' source/ target/seungseok/
      - name: 커밋 & 푸시
        run: |
          cd target
          git config user.name "tmdtjr"
          git config user.email "202040921+tmdtjr@users.noreply.github.com"
          git add seungseok
          git diff --staged --quiet || git commit -m "sync: update seungseok solutions"
          git push
